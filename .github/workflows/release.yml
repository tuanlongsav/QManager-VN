name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0-vn)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp package.json version from tag
        # build.sh reads the version from package.json and stamps it into
        # scripts/install_rm520n.sh (VERSION=...). That value then becomes
        # the contents of /etc/qmanager/VERSION on the modem after install,
        # which post_install_check compares against the tag the OTA worker
        # was asked to install. If package.json drifts from the tag, every
        # release stamps the same stale version and OTA fails the post-
        # install check — symptom: install reports success then reboots
        # but UI still shows the old version.
        #
        # Stamping here keeps the lockfile-compatible install dependencies
        # untouched (bun install --frozen-lockfile only validates deps,
        # not the package's own "version" field).
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Stamping package.json version → $TAG"
          # Replace ONLY the top-level version field (first match)
          sed -i '0,/"version":[[:space:]]*"[^"]*"/s||"version": "'"$TAG"'"|' package.json
          grep -E '"version":[[:space:]]*"'"$TAG"'"' package.json \
            || { echo "Failed to stamp package.json with $TAG"; cat package.json | head -5; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The gate `bun run package` already runs locally, which this workflow
      # was skipping entirely: it called `next build` and `build.sh` directly,
      # so a release cut by pushing a tag shipped without bash -n, i18n parity,
      # the conflict-copy scan, or the sudoers grammar check. A tag push is the
      # one path where nobody ran `bun run package` by hand first, so it is
      # exactly the path that needed the gate most.
      - name: Pre-build gate (syntax, i18n, conflict copies, sudoers grammar)
        run: bash scripts/test/run-all.sh

      - name: Build Next.js static export
        run: bun --bun next build

      - name: Package tarball (frontend + backend + deps)
        run: bash build.sh

      - name: Verify build artifacts
        run: |
          ls -lh qmanager-build/
          test -f qmanager-build/qmanager.tar.gz
          test -f qmanager-build/sha256sum.txt
          cat qmanager-build/sha256sum.txt

      - name: Determine prerelease flag
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # tags containing -beta / -rc / -alpha / -dev are prerelease
          if printf '%s' "$TAG" | grep -qE -- '-(beta|rc|alpha|dev|preview|test)([0-9]*)?$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QManager-VN ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            qmanager-build/qmanager.tar.gz
            qmanager-build/sha256sum.txt
          fail_on_unmatched_files: true
